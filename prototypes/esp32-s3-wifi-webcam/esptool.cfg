[esptool]
# The Freenove ESP32-S3 WROOM board is currently exposed through macOS'
# Apple CDC usbmodem driver. Reads work, but large writes/stub upload can time
# out, so keep the flashing path more patient for this prototype.
timeout = 10
mem_end_rom_timeout = 1.5
serial_write_timeout = 20
write_block_attempts = 8
reset_delay = 0.75
